services:
  backend:
    image: ghcr.io/fahizkp/wisdom-call-campaign-backend:latest
    container_name: wisdom-call-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5001
      - CORS_ORIGIN=https://calls.wisdommlpe.site
    networks:
      - web
      - wisdom-call-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.wisdom-call-backend.rule=Host(`calls.wisdommlpe.site`) && PathPrefix(`/api`)"
      - "traefik.http.routers.wisdom-call-backend.entrypoints=websecure"
      - "traefik.http.routers.wisdom-call-backend.tls=true"
      - "traefik.http.routers.wisdom-call-backend.tls.certresolver=myresolver"
      - "traefik.http.services.wisdom-call-backend.loadbalancer.server.port=5001"

  frontend:
    image: ghcr.io/fahizkp/wisdom-call-campaign-frontend:latest
    container_name: wisdom-call-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
      - wisdom-call-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.wisdom-call-frontend.rule=Host(`calls.wisdommlpe.site`)"
      - "traefik.http.routers.wisdom-call-frontend.entrypoints=websecure"
      - "traefik.http.routers.wisdom-call-frontend.tls=true"
      - "traefik.http.routers.wisdom-call-frontend.tls.certresolver=myresolver"
      - "traefik.http.services.wisdom-call-frontend.loadbalancer.server.port=80"

networks:
  web:
    external: true
  wisdom-call-internal:
